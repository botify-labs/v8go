name: Botify Bridge

# Rebuilds the prebuilt C++ bridge for every platform and commits it to the
# branch the workflow runs on. Run it after a tommie sync or a C++ change.
on:
  workflow_dispatch:
  # GitHub only dispatches workflows that exist on the default branch, or that
  # have already run once. Until upgrade-v8 is merged, a change to this file
  # on that branch runs it (the bot commit doesn't trigger workflows).
  push:
    branches: [upgrade-v8]
    paths: [.github/workflows/botify-bridge.yml]

jobs:
  build:
    name: Bridge ${{ matrix.os }}_${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
        - { os: linux, arch: amd64, platform: ubuntu-24.04 }
        - { os: linux, arch: arm64, platform: ubuntu-24.04-arm }
        - { os: darwin, arch: amd64, platform: macos-15-intel }
        - { os: darwin, arch: arm64, platform: macos-15 }
        - { os: windows, arch: amd64, platform: windows-latest }
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-clang
    - uses: actions/setup-go@v7
      with:
        go-version: '1.27'
    - run: go work init . ./deps/${{ matrix.os }}_${{ matrix.arch }}
    - run: tools/build_bridge.sh
    - uses: actions/upload-artifact@v4
      with:
        name: bridge-${{ matrix.os }}_${{ matrix.arch }}
        path: |
          deps/${{ matrix.os }}_${{ matrix.arch }}/libv8go.a
          deps/${{ matrix.os }}_${{ matrix.arch }}/v8go.lib
          deps/${{ matrix.os }}_${{ matrix.arch }}/bridge.sha256
        if-no-files-found: ignore

  commit:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v4
      with:
        pattern: bridge-*
        path: artifacts
    - name: Install bridges
      run: |
        for d in artifacts/bridge-*; do
          cp "$d"/* "deps/${d#artifacts/bridge-}/"
        done
        tools/check_bridge.sh
    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: Rebuild prebuilt v8go bridges
        file_pattern: deps/*/libv8go.a deps/*/v8go.lib deps/*/bridge.sha256
